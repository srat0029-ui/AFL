name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migration check - empty DB -> latest
        run: |
          rm -f /tmp/ci_migration_check.db
          DATABASE_URL=sqlite:////tmp/ci_migration_check.db python -m alembic upgrade head

      - name: Migration check - representative previous schema -> latest
        # 1817ff671b79 ("add placed bets") is roughly the pre-Trading-Monitor/
        # API-platform era of this schema - stamping a fresh DB there and
        # upgrading to head is the practical proxy for "an existing deployed
        # instance upgrading forward" without needing a fabricated data snapshot.
        run: |
          rm -f /tmp/ci_migration_upgrade_check.db
          DATABASE_URL=sqlite:////tmp/ci_migration_upgrade_check.db python -m alembic upgrade 1817ff671b79
          DATABASE_URL=sqlite:////tmp/ci_migration_upgrade_check.db python -m alembic upgrade head

      - name: Test suite
        run: pytest -q

  postgres-integration:
    # 16: the already-proven baseline this project was first verified
    # against. 18: the actual production target (Layerbase's managed
    # Postgres can only be created as 18 or a 19 beta - see
    # docs/DEPLOYMENT.md's "PostgreSQL version" section; 18 was chosen,
    # never the beta). Deliberately not 17 or 19 - scope is "retain the
    # proven baseline, verify the real production target," not general
    # version coverage.
    name: Postgres integration subset (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_USER: afl
          POSTGRES_PASSWORD: afl
          POSTGRES_DB: afl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://afl:afl@localhost:5432/afl
      TEST_DATABASE_URL: postgresql+psycopg://afl:afl@localhost:5432/afl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate real Postgres to head
        run: python -m alembic upgrade head

      - name: Run the tests that actually exercise Postgres-sensitive models
        # Not the full 1,730-test suite (slow, and most of it never touches
        # dialect-sensitive behavior) - this reuses real assertions from the
        # tests that cover PricingSnapshot, SgmPriceSnapshot, OddsQuote/
        # PropMarketObservation, ModelValueObservation, ApiUsageRecord/rate
        # limiting, settlement, live-cycle idempotency/durability, and the
        # prop-odds bulk-insert/query-count fix (see docs/DEPLOYMENT.md for
        # why these specifically).
        run: |
          pytest -q \
            tests/test_pricing.py \
            tests/test_prospective_evaluation.py \
            tests/test_sgm_snapshot_service.py \
            tests/test_sgm_prospective_evaluation.py \
            tests/test_model_value_observations.py \
            tests/test_prop_settlement.py \
            tests/test_live_cycle.py \
            tests/test_live_cycle_durability.py \
            tests/test_api_platform_usage_and_rate_limit.py \
            tests/test_api_platform_rate_limit.py \
            tests/test_prop_player_resolution.py \
            tests/test_prop_odds_ingestion.py \
            tests/test_prop_odds_performance.py \
            tests/test_real_fixture_regression.py

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b runs as part of this build - a separate typecheck step would
      # just be duplicate work.
      - run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        # OCI/GHCR image names must be lowercase - github.repository ("srat0029-ui/AFL")
        # isn't, so the raw context can't be used directly in a tag (this broke the
        # first real CI run: "repository name must be lowercase").
        run: |
          {
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (every PR and push - build-sanity, no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          # load: true - without it, buildx's docker-container driver (set
          # up by setup-buildx-action above) keeps the result only in its
          # own build cache; `docker run afl-backend:ci` in the next step
          # can't find it ("Unable to find image ... locally"). Reproduced
          # and confirmed locally with the same driver before adding this.
          load: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: afl-backend:ci

      - name: Verify curl is present in the built image
        # app/providers/afl/squiggle.py shells out to the real curl binary
        # (see its module docstring) - its absence from the base image
        # broke the first real production live cycle's fixture refresh
        # step silently, only discovered against Layerbase. This makes
        # that a build-time failure instead of a runtime one.
        run: docker run --rm afl-backend:ci curl --version

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:sha-${{ steps.meta.outputs.git_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:latest

  deploy:
    name: Deploy (manual promotion until enabled)
    runs-on: ubuntu-latest
    needs: [backend-test, postgres-integration, frontend-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render deploy hook
        # Inert until RENDER_DEPLOY_HOOK_URL is added as a repo secret - see
        # docs/DEPLOYMENT.md "Enabling continuous deployment". Until then,
        # promoting a build to production is a deliberate manual step.
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: No deploy hook configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not set - build passed CI, promotion to production is a manual step (see docs/DEPLOYMENT.md)."
