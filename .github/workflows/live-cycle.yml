name: Live Cycle

# Runs exactly one existing `run-live-cycle` invocation on a schedule, from
# the same immutable GHCR image production runs - never the infinite
# `run-scheduler` loop (that loop's own single-instance file lock is
# meaningless across ephemeral runner VMs anyway; `concurrency:` below is
# the correct equivalent for this execution model). See docs/DEPLOYMENT.md
# and docs/OPERATIONS.md for the full design rationale, including why the
# schedule is offset from the top of the hour and what happens after 60
# days of repository inactivity.
#
# Activation gate: a SCHEDULED run does nothing until the repository
# variable LIVE_CYCLE_ENABLED is explicitly set to "true" - an unset
# variable means disabled, so this can be committed and scheduled well
# before the production database and secrets exist without generating
# scheduled failures in the meantime. A manual workflow_dispatch always
# runs regardless of the variable - the documented rollout deliberately
# needs one manual run (to produce the first real LiveCycleRun and confirm
# the prospective-tracking boundary) BEFORE the recurring schedule is
# switched on. See docs/DEPLOYMENT.md's "Activation sequence".

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: live-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-live-cycle:
    name: Run one live cycle
    runs-on: ubuntu-latest
    # Scheduled runs skip until LIVE_CYCLE_ENABLED=true; a manual dispatch
    # always runs (needed for the one deliberate first production run in
    # the activation sequence, before the schedule is turned on).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIVE_CYCLE_ENABLED == 'true' }}
    # A hung run must not permanently block every future scheduled run -
    # cancel-in-progress: false means later runs queue behind this one
    # rather than cancel it, so a stuck job needs a hard ceiling. Raised
    # from 10 to 30: two real production dispatches were killed at ~615s
    # once fixture data existed for the cycle to do genuine work against
    # (team-context walk-forward + live model refit over the full
    # historical set, via a remote pooled connection) - 10 minutes was
    # only ever enough for the degenerate "nothing to do yet" case. The
    # run itself is now durably recorded step-by-step (see
    # app/player_modelling/live_cycle.py's "Durable run lifecycle" and
    # STALE_RUN_THRESHOLD_MINUTES=35, kept safely above this value) so a
    # timeout here no longer means a silent, unrecorded partial run.
    timeout-minutes: 30
    steps:
      - name: Run one live cycle from the CI-verified image
        # Pinned to sha-18412a7 (perf(pricing): eliminate player-pricing
        # query scaling) - the third and final round of local performance
        # hardening this cycle, on top of sha-551c724's PricingSnapshot
        # identity correctness fix (already applied to production as
        # migration 75715f635e7a and independently verified). The first
        # round (sha-8394e9f/sha-f509e1a) introduced MatchPricingContext -
        # one shared, read-only per-match preload - collapsing
        # snapshot_pricing's per-player-per-threshold market-intelligence
        # queries and market-monitor's per-player Bookmaker/lineup/context
        # reloads (measured 283.59s/377.80s in production;
        # market_monitor_prospective_snapshots timed out at 0 cases
        # frozen). This second round found and fixed the remaining
        # per-player cost inside app/pricing/player_pricing.py's
        # price_disposals/price_goals - each was independently re-querying
        # the globally-promoted PlayerModelRun/GoalModelRun row twice
        # (current_disposal_model_version/current_goal_model_version, and
        # again inside historical_calibration_metrics's own internal
        # lookup), plus a calibration-metric row and a player.display_name
        # lazy-load, all once PER PLAYER - measured 287/563 queries at
        # 46/92 players after the first round's fix. Extending
        # MatchPricingContext with disposal_model_version/
        # goal_model_version/calibration_by_key (keyed by the exact
        # (market_type, threshold) pairs historical_calibration_metrics
        # can ever be called with - a small fixed set, not reimplementing
        # its methodology) and players_by_id flattened this to a constant
        # 24 queries, confirmed identical at both 46 and 92 players - no
        # remaining player-count scaling. Verified in the exact published
        # image before this pin (digest
        # sha256:062b31d79c6bf80f9dd1d576af23f364a341f1973d9e0e04cfbfba80acb96a2a):
        # imports, psycopg3 URL normalization, curl, a real Squiggle
        # fetch, migration head, both corrected PricingSnapshot index
        # definitions, MatchPricingContext with all fields, price_disposals/
        # price_goals/price_single_match all context-aware, and every
        # prior fix (SGM active-match scoping, SGM zero-team-leg fix,
        # observation batching, durable run lifecycle, CLI hardening)
        # present by source inspection, and both entrypoints (run-live-cycle
        # CLI, app.main:app) - all with zero production access. Do not
        # repoint this at a later commit's own image without re-verifying
        # it the same way - see docs/DEPLOYMENT.md.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        # -e VAR (no =value) reads the value from this shell's environment
        # instead of writing it into the command line itself - the secret
        # value is never part of the invoked command text, only of the
        # process environment, and GitHub additionally masks the raw
        # secret value anywhere it might appear in step output regardless.
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e THE_ODDS_API_KEY \
            -e APP_ENV=production \
            ghcr.io/srat0029-ui/afl/backend:sha-c069109 \
            python -m app.player_modelling.cli run-live-cycle
        # No further steps and no `|| true` anywhere in this job: the
        # container's exit code (0=ok, 1=partial, 2=blocked - see
        # app/player_modelling/live_cycle.py) becomes this step's exit
        # code becomes the job's/workflow's conclusion, unmodified.
