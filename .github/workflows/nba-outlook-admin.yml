name: NBA Outlook Admin

# Manual operations for the hosted V1.5 outlook pipeline, run from the same
# pinned image as the live cycle against the hosted database. See
# docs/NBA_HOSTED_PROSPECTIVE.md.
#
# - verify-serving-models: the canonical model bundle is present in the image,
#   unmodified, and reproduces its golden predictions (no database access).
#   May target a different pinned image via image_override (e.g. a new
#   sha-<commit>@sha256:<digest> before it is pinned for production).
# - import-serving-models: writes the four canonical serving runs into the
#   hosted registry (append-only, idempotent). Never trains anything.
# - snapshot-dry-run: computes the snapshots that would be due now and
#   prints them with timing / rows read / peak memory; writes nothing.
#   Optional custom labels (dry runs only), e.g. T-372h.
# - registry: lists the serving runs in the hosted registry (read-only).
# - db-size: pg_database_size and the largest tables (read-only).
#
# Manual dispatch only. Shares the live cycle's concurrency group so it never
# runs at the same moment as an evidence cycle (each is a minute or two).

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [verify-serving-models, import-serving-models, snapshot-dry-run, registry, db-size]
        default: verify-serving-models
      labels:
        description: "snapshot-dry-run only: comma-separated labels (default T-24h,T-4h,T-1h,T-30m)"
        type: string
        default: ""
      image_override:
        description: "verify-serving-models only: a pinned image to verify instead of NBA_LIVE_CYCLE_IMAGE (no database access)"
        type: string
        default: ""

concurrency:
  group: nba-live-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admin:
    name: NBA outlook admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ inputs.image_override != '' && inputs.image_override || vars.NBA_LIVE_CYCLE_IMAGE }}
      OVERRIDE: ${{ inputs.image_override }}
      COMMAND: ${{ inputs.command }}
      LABELS: ${{ inputs.labels }}
    steps:
      - name: Check configuration
        run: |
          if [ -n "$OVERRIDE" ] && [ "$COMMAND" != "verify-serving-models" ]; then
            echo "::error::image_override is allowed only with verify-serving-models"; exit 1
          fi
          case "$IMAGE" in
            *@sha256:*|*:sha-*) ;;
            *) echo "::error::NBA_LIVE_CYCLE_IMAGE must be a pinned image, got '$IMAGE'"; exit 1 ;;
          esac

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          case "$COMMAND" in
            verify-serving-models)
              # No database access: verify the bundle inside the image itself.
              docker run --rm "$IMAGE" python -m app.nba.outlooks.cli verify-serving-models
              exit $? ;;
            import-serving-models) set -- python -m app.nba.outlooks.cli import-serving-models ;;
            snapshot-dry-run)
              set -- python -m app.nba.outlooks.cli snapshot --dry-run
              if [ -n "$LABELS" ]; then
                case "$LABELS" in *[!T0-9hm,.-]*) echo "::error::labels may contain only T, digits, h, m, '.', '-' and ','"; exit 1 ;; esac
                set -- "$@" --labels "$LABELS"
              fi ;;
            registry) set -- python -m app.nba.outlooks.cli registry ;;
            db-size) set -- python -m app.nba.outlooks.cli db-size ;;
            *) echo "::error::unknown command '$COMMAND'"; exit 1 ;;
          esac
          docker run --rm -e DATABASE_URL -e APP_ENV=production "$IMAGE" "$@"
